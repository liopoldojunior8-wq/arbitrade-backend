# railway.toml — Backend (Node.js + Express)
# Coloca este ficheiro na raiz do arbitrage-backend/

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run db:generate && npm run db:push"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production]
NODE_ENV = "production"
