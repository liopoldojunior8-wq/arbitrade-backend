# .github/workflows/deploy.yml
# Coloca em: arbitrage-backend/.github/workflows/deploy.yml
# Auto-deploy para Railway em cada push para main

name: Deploy Backend to Railway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Run tests (quando tiveres) ────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check syntax
        run: node --check src/index.js || true

  # ── Deploy to Railway ────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notify success
        if: success()
        run: echo "✅ Backend deployed to Railway successfully"
